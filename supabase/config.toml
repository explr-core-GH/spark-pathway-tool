# sync-explr runs on a pg_cron schedule via net.http_post, so it cannot carry a
# user JWT. It is protected instead by the x-sync-key header: the value lives in
# Supabase Vault (sync_secret) and in the function's SYNC_SECRET secret. It
# exposes no data (returns counts only) and the sync is idempotent.
[functions.sync-explr]
verify_jwt = false
