name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type check, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun x tsc --noEmit -p tsconfig.json

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Build
        env:
          # Public values only; the server-side secrets are set in Lovable Cloud.
          VITE_SUPABASE_URL: https://jpgxslmwuiamjabsxbuz.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bun run build

  accessibility:
    name: Accessibility gate (public routes)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
      - name: axe scan of the signed-out routes
        env:
          CI: "true"
          VITE_SUPABASE_URL: https://jpgxslmwuiamjabsxbuz.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bun x playwright test e2e/a11y.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
